<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readiness Quiz · COS212 DFS Tutor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M10.6 7.2 7.4 15.8M13.4 7.2l3.2 8.6"/></svg>
        </span>
        COS212 DFS TUTOR
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="learn.html">Learn</a>
        <a href="explorer.html">Explorer</a>
        <a href="practice.html">Practice</a>
        <a href="quiz.html" aria-current="page">Quiz</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="eyebrow" id="eyebrow">Readiness quiz / Question 1 of 6</p>
    <h1 class="page-title">Check your understanding</h1>
    <p class="lead">Six questions aligned to the lesson outcomes, with specific explanations for each answer.</p>

    <div class="progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1">
      <div class="progress__bar" id="progress-bar"></div>
    </div>

    <form id="quiz-form" class="card quiz-card" novalidate>
      <div class="quiz-main">
        <p class="tag" id="q-tag">QUESTION 01</p>
        <h2 class="q-prompt" id="q-prompt"></h2>
        <fieldset>
          <legend>Select one answer</legend>
          <div class="options" id="options"></div>
        </fieldset>
      </div>

      <aside class="quiz-side">
        <div id="tree-block">
          <div class="tree-wrap" id="tree"></div>
          <div class="tree-legend" aria-hidden="true">
            <span><i class="dot dot--visited"></i>Visited</span>
            <span><i class="dot dot--current"></i>Current</span>
            <span><i class="dot"></i>Not yet visited</span>
          </div>
        </div>

        <fieldset>
          <legend>How sure are you?</legend>
          <div class="seg" id="confidence">
            <label><input type="radio" name="confidence" value="guessing">Guessing</label>
            <label><input type="radio" name="confidence" value="unsure">Unsure</label>
            <label><input type="radio" name="confidence" value="fairly">Fairly sure</label>
            <label><input type="radio" name="confidence" value="certain">Certain</label>
          </div>
        </fieldset>
      </aside>
    </form>

    <div class="pager">
      <a class="btn btn--ghost" id="prev-btn" href="#">← Previous</a>
      <p class="pager__note" id="form-msg" aria-live="polite"></p>
      <button class="btn btn--primary" id="submit-btn" type="submit" form="quiz-form" disabled>Submit answer →</button>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
