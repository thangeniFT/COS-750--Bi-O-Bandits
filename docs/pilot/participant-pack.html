<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFS Tutor pilot: participant pack</title>
<!--
  Printable instruments for the peer pilot (ID appendix D, ticket Q-01).
  Open with #A, #B or #observer at the end of the URL, then print (A4, margins default).
    #A        pre-test Form 1, post-test Form 2   (odd participant ids)
    #B        pre-test Form 2, post-test Form 1   (even participant ids)
    #observer observation checklist
-->
<style>
  @page { size: A4; margin: 16mm 16mm 14mm; }
  * { box-sizing: border-box; }
  body { font: 11pt/1.45 "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111; margin: 0; background: #fff; }
  .page { page-break-after: always; break-after: page; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  header.run { display: flex; justify-content: space-between; font-size: 9pt; color: #555; border-bottom: 1px solid #999; padding-bottom: 4px; margin-bottom: 14px; }
  h1 { font-size: 16pt; margin: 0 0 4px; }
  h2 { font-size: 13pt; margin: 18px 0 6px; }
  p.lead { margin: 0 0 12px; color: #333; }
  .idbox { display: inline-block; border: 1.5px solid #111; padding: 4px 10px; min-width: 120px; font-weight: 600; }
  .tree { display: block; margin: 6px auto 10px; width: 300px; height: auto; }
  .tree line { stroke: #111; stroke-width: 1.6; }
  .tree circle { fill: #fff; stroke: #111; stroke-width: 1.6; }
  .tree text { font: 600 14px sans-serif; text-anchor: middle; dominant-baseline: central; }
  ol.qs { padding-left: 20px; margin: 0; }
  ol.qs li { margin-bottom: 10px; }
  .line { border-bottom: 1px solid #888; height: 26px; }
  .boxes { display: flex; gap: 6px; margin-top: 6px; }
  .boxes span { width: 40px; height: 30px; border: 1px solid #888; display: inline-block; }
  table { border-collapse: collapse; width: 100%; font-size: 10.5pt; }
  th, td { border: 1px solid #888; padding: 6px 7px; vertical-align: middle; }
  th { background: #eee; text-align: left; }
  td.n { text-align: center; width: 34px; }
  .scale-head th.n { text-align: center; font-weight: 600; width: 34px; }
  .open { border: 1px solid #888; height: 170px; margin-bottom: 14px; }
  .small { font-size: 9pt; color: #555; }
  .obs td { height: 34px; }
  .stop { margin-top: 18px; padding: 8px 12px; border: 1.5px dashed #111; font-weight: 600; text-align: center; }
  @media screen {
    body { background: #ddd; padding: 20px 0; }
    .page { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto 20px; padding: 16mm; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    nav { text-align: center; margin-bottom: 16px; font: 14px sans-serif; }
    nav a { margin: 0 8px; }
  }
  @media print { nav { display: none; } }
  @media screen and (max-width: 820px) { .page { width: auto; min-height: 0; margin: 0 12px 16px; padding: 16px; } }
</style>
</head>
<body>
<nav>Show: <a href="#A">Pack A</a> · <a href="#B">Pack B</a> · <a href="#observer">Observer sheet</a> — then print</nav>
<main id="root"></main>

<script>
(function () {
  // Tree layouts for ID appendix D forms (balanced, 7 nodes).
  const FORMS = {
    1: { values: [40, 20, 60, 10, 30, 50, 70] },
    2: { values: [35, 15, 55, 5, 25, 45, 65] }
  };
  // positions: root, L, R, LL, LR, RL, RR
  const POS = [[150, 22], [80, 82], [220, 82], [40, 142], [120, 142], [180, 142], [260, 142]];
  const EDGES = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]];

  function treeSvg(v) {
    // values are in insertion order root, L, R, LL, LR, RL, RR for these balanced trees
    const lines = EDGES.map(([a, b]) => `<line x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}"/>`).join('');
    const nodes = POS.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="17"/><text x="${x}" y="${y}">${v[i]}</text>`).join('');
    return `<svg class="tree" viewBox="0 0 300 165" role="img" aria-label="Binary search tree">${lines}${nodes}</svg>`;
  }

  const run = (label) => `<header class="run"><span>COS212 DFS Tutor · peer pilot</span><span>${label}</span><span>Participant ID: ______</span></header>`;

  function testPage(when, form, packLabel) {
    const v = FORMS[form].values;
    return `<section class="page">${run(packLabel)}
      <h1>${when === 'pre' ? 'Before you start' : 'After the app'}: short test (Form ${form})</h1>
      <p class="lead">${when === 'pre'
        ? "Answer what you can. It is fine not to know yet, that is what we are measuring."
        : "Same kind of questions as before, on a different tree."} About 5 minutes. Use the tree below for questions 2 to 4.</p>
      <p class="small">This tree was built by inserting ${v.join(', ')} into an empty binary search tree.</p>
      ${treeSvg(v)}
      <ol class="qs">
        <li>Which data structure does depth-first search (DFS) use to remember where to go back to?<div class="line"></div></li>
        <li>Write down the <strong>pre-order</strong> traversal of the tree.<div class="boxes">${'<span></span>'.repeat(7)}</div></li>
        <li>Write down the <strong>in-order</strong> traversal of the tree.<div class="boxes">${'<span></span>'.repeat(7)}</div></li>
        <li>DFS is searching for the <strong>right-most leaf</strong>. List the nodes it visits, in order.<div class="boxes">${'<span></span>'.repeat(7)}</div></li>
        <li>In one sentence, explain what "depth-first" means.<div class="line"></div><div class="line"></div></li>
      </ol>
      ${when === 'pre' ? '<div class="stop">Stop here. Tell the facilitator you are done, then open the app.</div>' : ''}
    </section>`;
  }

  const SUS_ITEMS = [
    'I think that I would like to use this app frequently.',
    'I found the app unnecessarily complex.',
    'I thought the app was easy to use.',
    'I think that I would need the support of a technical person to be able to use this app.',
    'I found the various functions in this app were well integrated.',
    'I thought there was too much inconsistency in this app.',
    'I would imagine that most people would learn to use this app very quickly.',
    'I found the app very cumbersome to use.',
    'I felt very confident using the app.',
    'I needed to learn a lot of things before I could get going with this app.'
  ];

  function susPage(packLabel) {
    const rows = SUS_ITEMS.map((t, i) => `<tr><td class="n">${i + 1}</td><td>${t}</td>${[1, 2, 3, 4, 5].map(n => `<td class="n">${n}</td>`).join('')}</tr>`).join('');
    return `<section class="page">${run(packLabel)}
      <h1>How was the app to use?</h1>
      <p class="lead">Circle one number per statement. Answer quickly with your first reaction. If you are not sure, circle 3.</p>
      <table>
        <thead class="scale-head"><tr><th class="n">#</th><th>Statement</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">5</th></tr>
        <tr><th></th><th class="small">1 = strongly disagree · 5 = strongly agree</th><th colspan="5"></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="small">System Usability Scale (Brooke, 1996), with "system" replaced by "app".</p>
    </section>`;
  }

  function openPage(packLabel) {
    return `<section class="page">${run(packLabel)}
      <h1>Three last questions</h1>
      <h2>1. What helped you most to understand DFS?</h2><div class="open"></div>
      <h2>2. Was anything confusing? Where? (name the screen if you can)</h2><div class="open"></div>
      <h2>3. If you could change one thing about the app, what would it be?</h2><div class="open"></div>
      <p><strong>Thank you!</strong> Hand this pack back to the facilitator.</p>
    </section>`;
  }

  function pack(letter) {
    const pre = letter === 'A' ? 1 : 2;
    const post = letter === 'A' ? 2 : 1;
    const label = `Pack ${letter}`;
    return testPage('pre', pre, label) + testPage('post', post, label) + susPage(label) + openPage(label);
  }

  function observer() {
    const head = `<header class="run"><span>COS212 DFS Tutor · peer pilot</span><span>Observer sheet</span><span>Participant ID: ______</span></header>`;
    const checklist = [
      'Hesitates for more than 10 seconds',
      'Uses a hint (level 1 / 2 / 3)',
      'Goes back to a previous screen',
      'Says something unexpected or incorrect aloud',
      'Uses a Hint button or "Read this page"'
    ];
    const rows = checklist.map(c => `<tr><td>${c}</td><td></td><td></td><td></td></tr><tr><td class="small">&nbsp;&nbsp;(again)</td><td></td><td></td><td></td></tr>`).join('');
    const free = Array.from({ length: 6 }, () => '<tr><td></td><td></td><td></td><td></td></tr>').join('');
    return `<section class="page">${head}
      <h1>Observation checklist</h1>
      <table style="margin-bottom:12px"><tbody>
        <tr><th style="width:25%">Round</th><td>one-to-one &nbsp;/&nbsp; small group</td><th style="width:20%">Pack</th><td>A &nbsp;/&nbsp; B</td></tr>
        <tr><th>Start time (app opened)</th><td></td><th>End time (summary)</th><td></td></tr>
        <tr><th>Quiz score shown</th><td>&nbsp;&nbsp;&nbsp;&nbsp;/ 8</td><th>Guided review shown?</th><td>yes &nbsp;/&nbsp; no</td></tr>
        <tr><th>Facilitator stepped in?</th><td colspan="3">no &nbsp;/&nbsp; yes, at:</td></tr>
      </tbody></table>
      <table class="obs">
        <thead><tr><th style="width:42%">Observation</th><th style="width:16%">Screen</th><th style="width:10%">Time</th><th>Note (what they did or said, word for word if possible)</th></tr></thead>
        <tbody>${rows}${free}</tbody>
      </table>
      <p class="small">Screens: welcome · bst · dfs · explorer · practice · quiz · review · summary. Use the same names in results.csv.</p>
    </section>`;
  }

  function render() {
    const key = (location.hash || '#A').slice(1);
    const root = document.getElementById('root');
    root.innerHTML = key === 'observer' ? observer() : pack(key === 'B' ? 'B' : 'A');
    document.title = key === 'observer' ? 'DFS pilot observer sheet' : `DFS pilot participant pack ${key === 'B' ? 'B' : 'A'}`;
  }
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
