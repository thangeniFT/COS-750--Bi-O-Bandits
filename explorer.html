<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS212 DFS Tutor – Interactive Explorer</title>
<style>
  :root { --ink:#1f2430; --muted:#6b7280; --line:#e3e6eb; --panel:#f1f4f7; --good:#1f7a4d; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e6e6e6; font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  .page { max-width:1000px; margin:16px auto; background:#fff; min-height:600px; }

  header { display:flex; justify-content:space-between; align-items:center; padding:18px 56px; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:.02em; }
  nav { display:flex; gap:32px; font-size:13px; }
  nav a { color:var(--ink); text-decoration:none; }
  nav a.active { font-weight:700; }
  nav a:hover { text-decoration:underline; }

  main { padding:28px 56px 32px; }
  .crumb { font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  h1 { font-size:32px; margin:18px 0 8px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 22px; }

  /* Toolbar */
  .toolbar { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  .group { display:flex; align-items:center; gap:8px; }
  .group label { font-size:11px; font-weight:700; max-width:60px; line-height:1.2; }
  input[type=text] { font:inherit; font-size:12px; width:90px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input[type=text]:focus { outline:2px solid #2563eb; outline-offset:1px; }
  button { font:inherit; font-size:12px; font-weight:600; padding:10px 16px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--ink); }
  button:focus-visible, a:focus-visible { outline:2px solid #2563eb; outline-offset:2px; }
  button.dark { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; }
  #status { font-size:12px; color:var(--muted); min-height:18px; margin:8px 2px 12px; }
  #status.err { color:var(--bad); }

  /* Panels */
  .grid { display:grid; grid-template-columns:1fr 292px; gap:18px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:16px; }
  .card h3 { margin:0 0 8px; font-size:16px; }
  .side { background:var(--panel); display:flex; flex-direction:column; }
  .treebox { overflow-x:auto; }
  svg { width:100%; min-width:300px; height:auto; display:block; }
  .edge { stroke:#9aa1ad; stroke-width:1.5; }
  .node circle { fill:#fff; stroke:var(--ink); stroke-width:1.5; transition:fill .2s; }
  .node text.val { font-size:13px; font-weight:600; text-anchor:middle; dominant-baseline:central; fill:var(--ink); }
  .node text.tick { font-size:11px; fill:var(--ink); }
  .node.current circle { fill:var(--ink); }
  .node.current text.val { fill:#fff; }
  .node.target circle { stroke-dasharray:3 2; }
  .node.found circle { fill:var(--good); stroke:var(--good); }
  .visited-line { font-size:12px; font-weight:600; margin:10px 0 0; }

  /* Stack */
  #stack { list-style:none; margin:6px 0 14px; padding:0; }
  #stack li { background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; font-weight:700; font-size:14px; }
  #stack li small { font-weight:400; color:var(--muted); margin-left:6px; }
  #stack li .tag { font-size:10px; font-weight:600; letter-spacing:.06em; color:var(--muted); }
  #stack li.empty { color:var(--muted); font-weight:400; font-size:13px; }
  #explain { font-size:12px; line-height:1.5; margin:auto 0 0; }

  footer { display:flex; align-items:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
  footer .counter { margin-left:auto; margin-right:24px; font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--muted); }
  footer button { padding:14px 20px; font-weight:700; }
  .practice { font-size:12px; font-weight:700; color:var(--ink); }

  @media (max-width:760px) {
    header, main { padding-left:20px; padding-right:20px; }
    header { flex-direction:column; gap:10px; }
    nav { gap:16px; flex-wrap:wrap; justify-content:center; }
    .grid { grid-template-columns:1fr; }
    footer .counter { margin:0; width:100%; order:-1; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">COS212 DFS TUTOR</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="explorer.html" class="active" aria-current="page">Explorer</a>
      <a href="practice.html">Practice</a>
      <a href="quiz.html">Quiz</a>
    </nav>
  </header>

  <main>
    <div class="crumb" id="crumb">Interactive explorer / Step 1 of 1</div>
    <h1>Explore DFS, step by step</h1>
    <p class="sub">Watch the visited node, pending stack and traversal order change as you explore.</p>

    <div class="toolbar">
      <div class="group">
        <label for="insertInput">Insert value</label>
        <input type="text" id="insertInput" placeholder="e.g. 65" inputmode="numeric" autocomplete="off">
        <button id="insertBtn">Insert</button>
      </div>
      <div class="group">
        <label for="targetInput">Find target</label>
        <input type="text" id="targetInput" placeholder="60" inputmode="numeric" autocomplete="off">
        <button id="searchBtn" class="dark">Search</button>
      </div>
      <button id="resetBtn">Reset tree</button>
      <button id="modeBtn">Traversal: Pre-order</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

    <div class="grid">
      <section class="card">
        <h3>Binary Search Tree</h3>
        <div class="treebox"><svg id="tree" role="img" aria-label="Binary search tree"></svg></div>
        <p class="visited-line" id="visited"></p>
      </section>

      <section class="card side">
        <h3>DFS Stack (top first)</h3>
        <ul id="stack"></ul>
        <p id="explain"></p>
      </section>
    </div>

    <footer>
      <button id="prevBtn">← Previous</button>
      <button id="nextBtn" class="dark">Next step →</button>
      <button id="restartBtn">Restart</button>
      <span class="counter" id="counter"></span>
      <a class="practice" href="practice.html">Try guided practice →</a>
    </footer>
  </main>
</div>

<script>
/* ---------- State ---------- */
const DEFAULT_VALUES = [50, 30, 70, 20, 40, 60, 80];
const MODES = ["Pre-order", "In-order", "Post-order"];
let root = null, target = null, mode = 0, steps = [], idx = 0;

/* ---------- BST helpers ---------- */
const insertNode = (n, v) => !n ? { v, l: null, r: null }
  : (v < n.v ? (n.l = insertNode(n.l, v)) : (n.r = insertNode(n.r, v)), n);
const contains = (n, v) => !n ? false : v === n.v || contains(v < n.v ? n.l : n.r, v);

function resetTree() {
  root = null;
  DEFAULT_VALUES.forEach(v => root = insertNode(root, v));
  target = null;
}

/* ---------- Build DFS steps (iterative, explicit stack) ----------
   Stack frames are {n, a}: a = "explore" (expand node) or "visit" (record node).
   Expanding pushes frames so the traversal order falls out of the stack order. */
function stepText(n) {
  const l = n.l?.v, r = n.r?.v;
  if (mode === 0) {
    if (l === undefined && r === undefined) return `Visit ${n.v}. It is a leaf, so backtrack and pop the next node.`;
    const parts = [];
    if (r !== undefined) parts.push(`right child ${r}`);
    if (l !== undefined) parts.push(`left child ${l}`);
    return `Visit ${n.v}. Push ${parts.join(", then ")}.`;
  }
  if (mode === 1) return `Visit ${n.v} (its left subtree is finished). ${r !== undefined ? `Next, explore right child ${r}.` : "It has no right child, so backtrack."}`;
  return `Visit ${n.v} now that both of its subtrees are finished.`;
}

function buildSteps() {
  steps = [];
  if (!root) return;
  const visited = [];
  const stack = [{ n: root, a: "explore" }];
  const snap = (cur, text, extra = {}) => steps.push({
    cur, text, visited: [...visited],
    stack: stack.map(f => ({ v: f.n.v, a: f.a })).reverse(), // top first
    ...extra
  });
  snap(null, `Start: push the root (${root.v}) onto the stack.`);

  while (stack.length) {
    const { n, a } = stack.pop();
    if (a === "explore") {
      const R = n.r && { n: n.r, a: "explore" };
      const L = n.l && { n: n.l, a: "explore" };
      const V = { n, a: "visit" };
      const order = mode === 0 ? [R, L, V] : mode === 1 ? [R, V, L] : [V, R, L]; // last = top of stack
      order.forEach(f => f && stack.push(f));
    } else {
      visited.push(n.v);
      if (n.v === target) { snap(n.v, `Found ${n.v}! The search stops here.`, { found: true }); return; }
      snap(n.v, stepText(n));
    }
  }
  snap(null, target !== null ? `Traversal finished: ${target} is not in the tree.` : "Traversal complete: the stack is empty.");
}

/* ---------- Rendering ---------- */
function drawTree(step) {
  const NS = "http://www.w3.org/2000/svg", GAP = 46, ROW = 70, PAD = 30;
  const pos = {}; let i = 0, maxD = 0;
  (function walk(n, d) {
    if (!n) return;
    walk(n.l, d + 1);
    pos[n.v] = { x: PAD + i++ * GAP, y: PAD + d * ROW, n };
    maxD = Math.max(maxD, d);
    walk(n.r, d + 1);
  })(root, 0);
  const W = Math.max(300, PAD * 2 + (i - 1) * GAP), H = PAD * 2 + maxD * ROW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = "";
  const add = (html) => svg.insertAdjacentHTML("beforeend", html);

  Object.values(pos).forEach(({ x, y, n }) => [n.l, n.r].forEach(c => {
    if (c) add(`<line class="edge" x1="${x}" y1="${y}" x2="${pos[c.v].x}" y2="${pos[c.v].y}"/>`);
  }));
  Object.entries(pos).forEach(([val, { x, y }]) => {
    const v = Number(val);
    let cls = "node";
    if (step.cur === v) cls += step.found ? " found" : " current";
    if (v === target) cls += " target";
    const tick = step.visited.includes(v) ? `<text class="tick" x="${x + 15}" y="${y - 14}">✓</text>` : "";
    add(`<g class="${cls}"><circle cx="${x}" cy="${y}" r="17"/><text class="val" x="${x}" y="${y}">${v}</text>${tick}</g>`);
  });
}

function render() {
  const s = steps[idx];
  drawTree(s);
  document.getElementById("visited").textContent = s.visited.length ? "Visited: " + s.visited.join(" → ") : "Visited: none yet";
  document.getElementById("explain").textContent = s.text;

  const ul = document.getElementById("stack");
  ul.innerHTML = s.stack.length ? s.stack.map((f, k) => {
    const note = mode === 0 ? "" : `<small>${f.a}</small>`;
    return `<li><span>${f.v}${note}</span><span class="tag">${k === 0 ? "NEXT" : "PENDING"}</span></li>`;
  }).join("") : `<li class="empty">Stack is empty</li>`;

  document.getElementById("counter").textContent = `STEP ${idx + 1} OF ${steps.length}`;
  document.getElementById("crumb").textContent = `Interactive explorer / Step ${idx + 1} of ${steps.length}`;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === steps.length - 1;
  document.getElementById("restartBtn").disabled = idx === 0;
}

function rebuild(msg, isErr = false) {
  buildSteps(); idx = 0; render();
  setStatus(msg, isErr);
}
function setStatus(msg = "", isErr = false) {
  const el = document.getElementById("status");
  el.textContent = msg; el.className = isErr ? "err" : "";
}

/* ---------- Events ---------- */
const svg = document.getElementById("tree");
const parse = (id) => {
  const raw = document.getElementById(id).value.trim();
  return /^-?\d{1,3}$/.test(raw) ? Number(raw) : null;
};

document.getElementById("insertBtn").onclick = () => {
  const v = parse("insertInput");
  if (v === null) return setStatus("Enter a whole number between -999 and 999.", true);
  if (contains(root, v)) return setStatus(`${v} is already in the tree.`, true);
  root = insertNode(root, v);
  document.getElementById("insertInput").value = "";
  rebuild(`Inserted ${v}. The traversal has restarted.`);
};

document.getElementById("searchBtn").onclick = () => {
  const raw = document.getElementById("targetInput").value.trim();
  if (raw === "") { target = null; return rebuild("Target cleared. Showing the full traversal."); }
  const v = parse("targetInput");
  if (v === null) return setStatus("Enter a whole number to search for.", true);
  target = v;
  rebuild(`Searching for ${v}. Step through to follow the DFS.`);
};

document.getElementById("resetBtn").onclick = () => {
  resetTree();
  document.getElementById("insertInput").value = "";
  document.getElementById("targetInput").value = "";
  rebuild("Tree reset to the default values.");
};

document.getElementById("modeBtn").onclick = (e) => {
  mode = (mode + 1) % MODES.length;
  e.target.textContent = `Traversal: ${MODES[mode]}`;
  rebuild(`Switched to ${MODES[mode].toLowerCase()} traversal.`);
};

document.getElementById("nextBtn").onclick = () => { if (idx < steps.length - 1) { idx++; render(); } };
document.getElementById("prevBtn").onclick = () => { if (idx > 0) { idx--; render(); } };
document.getElementById("restartBtn").onclick = () => { idx = 0; render(); };

["insertInput", "targetInput"].forEach(id =>
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById(id === "insertInput" ? "insertBtn" : "searchBtn").click();
  }));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
  if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
});

/* ---------- Start ---------- */
resetTree();
rebuild();
</script>
</body>
</html>
