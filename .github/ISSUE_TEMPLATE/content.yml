name: Content change
description: Wording in the lesson, quiz, feedback or glossary
labels: [content]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Screen id (from the URL, for example #/concept-stack) or quiz item id (for example 3A)
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: Which misconception, learning outcome or ID writing rule does this serve? Quiz answers must be checked against the Java output.
    validations:
      required: true
