# Runs on every pull request and on every push to main.
# A pull request can only be merged when both jobs are green (see CONTRIBUTING.md, branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # chmod: the executable flag can be lost if the repo was pushed from Windows or a zip
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Keep test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  frontend:
    name: Frontend and content tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests (no install step needed)
        run: npm test
