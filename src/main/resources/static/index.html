<!doctype html>
<!--
  COS212 DFS Tutor: the single page of the app.

  This file is only a frame. Each lesson screen is drawn into <section id="screen"> by
  js/app.js, using the content in data/lesson.json and a renderer from js/screens/.
  There is no build step: edit, save and refresh the browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COS212 DFS Tutor</title>
  <meta name="description" content="A short pre-lecture tutor for depth-first search on a binary search tree.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/welcome.css">
  <link rel="stylesheet" href="css/bst.css">
  <link rel="stylesheet" href="css/dfs.css">
  <link rel="stylesheet" href="/css/lesson-progress.css">
  <link rel="stylesheet" href="/css/explorer.css">
<link rel="stylesheet" href="/css/practice.css">
<link rel="stylesheet" href="/css/quiz.css">
<link rel="stylesheet" href="/css/review.css">

<link rel="stylesheet" href="/css/summary.css">

  <script type="module" src="js/app.js"></script>
  
</head>
<body>
  <a class="skip-link" href="#main">Skip to the lesson</a>

  <header class="app-header">
    <div class="app-header__title">COS212 DFS Tutor</div>
    <div class="app-header__progress">
      <span id="progress-label" class="app-header__step">Loading&hellip;</span>
      <div id="progress" class="progress" role="progressbar" aria-labelledby="progress-label"
           aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
        <div class="progress__bar"></div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- The current screen is rendered here. aria-live lets screen readers announce new screens. -->
    <section id="screen" class="screen" aria-live="polite">
      <noscript>This tutor needs JavaScript. Please enable it and reload the page.</noscript>
    </section>
  </main>

  <nav class="screen-nav" aria-label="Lesson navigation">
    <button id="nav-back" type="button" class="btn">Back</button>
    <button id="nav-next" type="button" class="btn btn--primary">Next</button>
  </nav>

  <footer class="app-footer">
  
  </footer>
</body>
</html>
