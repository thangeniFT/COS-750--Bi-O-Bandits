<!doctype html>
<!--
  COS212 DFS Tutor: the single page of the app.
  This file is only a frame: a header with the section menu, and an empty <section id="screen">.
  js/app.js reads data/lesson.json and draws the current screen into that section.
  There is no build step: edit, save and refresh the browser.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COS212 DFS Tutor</title>
  <meta name="description" content="A short pre-lecture tutor for depth-first search on a binary search tree.">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the lesson</a>
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__brand" href="#/home">COS212 DFS Tutor</a>
      <!-- Filled in by app.js from lesson.json "sections". A tick marks a finished section. -->
      <nav aria-label="Sections">
        <ul id="section-nav" class="section-nav"></ul>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <!-- The current screen is drawn here. aria-live lets screen readers announce new screens. -->
    <section id="screen" class="screen" aria-live="polite">
      <noscript>This tutor needs JavaScript. Please enable it and reload the page.</noscript>
    </section>
  </main>
</body>
</html>
