<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COS212 DFS Tutor – Interactive Explorer</title>
<link rel="stylesheet" href="css/explorer.css">
</head>
<body>
<div class="page">
  <header>
    <div class="brand">COS212 DFS TUTOR</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="explorer.html" class="active" aria-current="page">Explorer</a>
      <a href="practice.html">Practice</a>
      <a href="quiz.html">Quiz</a>
    </nav>
  </header>

  <main>
    <div class="crumb" id="crumb">Interactive explorer / Step 1 of 1</div>
    <h1>Explore DFS, step by step</h1>
    <p class="sub">Watch the visited node, pending stack and traversal order change as you explore.</p>

    <div class="toolbar">
      <div class="group">
        <label for="insertInput">Insert value</label>
        <input type="text" id="insertInput" placeholder="e.g. 65" inputmode="numeric" autocomplete="off">
        <button id="insertBtn">Insert</button>
      </div>
      <div class="group">
        <label for="targetInput">Find target</label>
        <input type="text" id="targetInput" placeholder="60" inputmode="numeric" autocomplete="off">
        <button id="searchBtn" class="dark">Search</button>
      </div>
      <button id="resetBtn">Reset tree</button>
      <button id="modeBtn">Traversal: Pre-order</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>

    <div class="grid">
      <section class="card">
        <h3>Binary Search Tree</h3>
        <div class="treebox"><svg id="tree" role="img" aria-label="Binary search tree"></svg></div>
        <p class="visited-line" id="visited"></p>
      </section>

      <section class="card side">
        <h3>DFS Stack (top first)</h3>
        <ul id="stack"></ul>
        <p id="explain"></p>
      </section>
    </div>

    <footer>
      <button id="prevBtn">← Previous</button>
      <button id="nextBtn" class="dark">Next step →</button>
      <button id="restartBtn">Restart</button>
      <span class="counter" id="counter"></span>
      <a class="practice" href="practice.html">Try guided practice →</a>
    </footer>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/explorer.js"></script>
</body>
</html>
