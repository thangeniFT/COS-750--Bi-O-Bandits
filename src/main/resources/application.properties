# =====================================================================
#  COS212 DFS Tutor configuration
#  Any key can be overridden on the command line, for example:
#    ./mvnw spring-boot:run -Dspring-boot.run.arguments=--server.port=8081
# =====================================================================

spring.application.name=cos212-dfs-tutor
server.port=8080

# --- Business rules (SE document, section 5.3) ------------------------
# BR-1: allowed node values (two digits keep the circles readable)
tutor.min-value=0
tutor.max-value=99
# BR-5: most nodes a tree may hold (fits on a laptop screen)
tutor.max-nodes=15
# The example tree (tree A in the lesson). Order matters: it decides the shape.
tutor.example-tree=50,30,70,20,40,60,80

# --- JSON strictness --------------------------------------------------
# Reject 3.5 instead of silently turning it into 3.
spring.jackson.deserialization.accept-float-as-int=false
# Reject unknown fields such as {"valeu": 5}, so typos in the frontend show up immediately.
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Errors -----------------------------------------------------------
# Never send stack traces to the browser (NFR-04), even when devtools is on.
# API errors are formatted by ApiExceptionHandler; this covers everything else.
server.error.include-stacktrace=never

# --- Logging ----------------------------------------------------------
logging.level.za.ac.up.dfstutor=INFO
